[package]
name = "crud-cli"
version = "0.1.0"
edition = "2021"
description = "CRUD CLI — setup and codegen for CRUD projects"
license = "MIT OR Apache-2.0"

[lib]
name = "crud_cli"
path = "src/lib.rs"

[[bin]]
name = "crud-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:inquire", "dep:tracing-subscriber"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
tempfile = "3.14"
dirs = "6.0"
handlebars = "6.0"
convert_case = "0.6"

clap = { version = "4.6", features = ["derive"], optional = true }
inquire = { version = "0.9", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.14"

[[test]]
name = "panic_contract"
path = "tests/contracts/panic_contract.rs"
required-features = ["cli"]

[[test]]
name = "agent_output_contract"
path = "tests/contracts/agent_output_contract.rs"
required-features = ["cli"]

[[test]]
name = "setup_byte_identical"
path = "tests/contracts/setup_byte_identical.rs"
required-features = ["cli"]

[[example]]
name = "library_usage"
path = "examples/library_usage.rs"
required-features = []

[[test]]
name = "setup_args_tests"
path = "tests/setup_args_tests.rs"
required-features = ["cli"]

[[test]]
name = "setup_config_tests"
path = "tests/setup_config_tests.rs"
required-features = ["cli"]

[[test]]
name = "setup_wizard_tests"
path = "tests/setup_wizard_tests.rs"
required-features = ["cli"]

[[test]]
name = "fs_writer_tests"
path = "tests/fs_writer_tests.rs"

[[test]]
name = "setup_write_tests"
path = "tests/setup_write_tests.rs"
required-features = ["cli"]

[[test]]
name = "gen_e2e_happy_path"
path = "tests/gen_e2e_happy_path.rs"
required-features = ["cli"]

[[test]]
name = "gen_args_tests"
path = "tests/gen_args_tests.rs"
required-features = ["cli"]

[[test]]
name = "field_dsl_tests"
path = "tests/field_dsl_tests.rs"
required-features = ["cli"]
