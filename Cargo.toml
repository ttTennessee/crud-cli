[package]
name = "crud-cli"
version = "0.1.0"
edition = "2021"
description = "CRUD CLI — setup and codegen for CRUD projects"
license = "MIT OR Apache-2.0"

[lib]
name = "crud_cli"
path = "src/lib.rs"

[[bin]]
name = "crud-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:inquire", "dep:tracing-subscriber"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
tempfile = "3.14"
dirs = "6.0"
handlebars = "6.0"
convert_case = "0.6"
ignore = "0.4"

clap = { version = "4.6", features = ["derive"], optional = true }
inquire = { version = "0.9", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
serde_path_to_error = "0.1"
strsim = "0.11"
gray_matter = "0.2"
globset = "0.4"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
flate2 = "1.0"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[dev-dependencies]
tempfile = "3.14"

[[test]]
name = "panic_contract"
path = "tests/contracts/panic_contract.rs"
required-features = ["cli"]

[[test]]
name = "agent_output_contract"
path = "tests/contracts/agent_output_contract.rs"
required-features = ["cli"]

[[test]]
name = "setup_byte_identical"
