name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Core lib without CLI deps
        run: cargo check --no-default-features --lib

      - name: Release build
        run: cargo build --release

      - name: CLI --help / --version (CONF-10)
        shell: bash
        run: |
          BIN=target/release/crud-cli
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=target/release/crud-cli.exe; fi
          "$BIN" --help
          "$BIN" --version

      - name: Core-only example (FOUND-03)
        run: cargo run --example library_usage --no-default-features

      - name: Contract tests
        run: >-
          cargo test
          handlebars_no_escape_contract
          panic_contract
          agent_output_contract
          agent_output_no_ansi_contract
          agent_success_stdout_empty
          setup_byte_identical
          -q

      - name: Full test suite
        run: cargo test -q

      - name: Stream discipline grep (FOUND-10)
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '(println!|eprintln!)' src | rg -v 'src/cli/output.rs'; then
            echo 'println!/eprintln! found outside src/cli/output.rs'
            exit 1
          fi

      - name: Clippy deny policy (FOUND-07 / D-15)
        run: >-
          cargo clippy --all-targets
          --
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
