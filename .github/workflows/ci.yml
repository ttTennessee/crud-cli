name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Core lib without CLI deps
        run: cargo check --no-default-features --lib

      - name: CLI --help / --version
        run: |
          cargo run --quiet -- --help
          cargo run --quiet -- --version

      - name: Core-only example
        run: cargo run --example library_usage --no-default-features

      - name: Contract tests
        run: >-
          cargo test -q --
          handlebars_no_escape_contract
          panic_contract
          agent_output_contract
          agent_output_no_ansi_contract
          agent_success_stdout_empty
          gen_file_and_fields_outputs_byte_identical
          setup_byte_identical

      - name: Full test suite
        run: cargo test -q

      - name: Stream discipline grep
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '(println!|eprintln!)' src | rg -v 'src/cli/output.rs'; then
            echo 'println!/eprintln! found outside src/cli/output.rs'
            exit 1
          fi

      - name: Clippy deny policy
        run: cargo clippy --all-targets

      - name: Clippy core-only
        run: cargo clippy --no-default-features --lib
