name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!(**/*.md|docs/**|LICENSE*|.gitignore)'
              - '**/*.rs'
              - '**/*.toml'
              - '**/*.hbs'
              - '.github/workflows/**'
              - 'templates/**'
              - 'tests/**'

  # Always runs (required status check). On docs-only PRs every heavy step
  # short-circuits via the `if:` on each step, so the job returns green in seconds.
  test-ubuntu:
    name: ubuntu-latest
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docs-only PR — skipping build/test
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes detected; skipping build/test steps."

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          shared-key: ubuntu-latest

      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          tool: nextest

      - name: Rustfmt check
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check

      - name: Core lib without CLI deps
        if: needs.changes.outputs.code == 'true'
        run: cargo check --no-default-features --lib

      - name: CLI --help / --version
        if: needs.changes.outputs.code == 'true'
        run: |
          cargo run --quiet -- --help
          cargo run --quiet -- --version

      - name: Core-only example
        if: needs.changes.outputs.code == 'true'
        run: cargo run --example library_usage --no-default-features

      - name: Test suite (all features)
        if: needs.changes.outputs.code == 'true'
        run: cargo nextest run --all-features

      - name: Clippy (default features)
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features — covers mcp module)
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy core-only
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --no-default-features --lib -- -D warnings

  # Skipped entirely on docs-only PRs.
  test-other:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Core lib without CLI deps
        run: cargo check --no-default-features --lib

      - name: CLI --help / --version
        run: |
          cargo run --quiet -- --help
          cargo run --quiet -- --version

      - name: Core-only example
        run: cargo run --example library_usage --no-default-features

      - name: Test suite (all features)
        run: cargo nextest run --all-features

  # Dependency audit: licenses, advisories, banned crates, sources.
  # Config: deny.toml at the repo root.
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
